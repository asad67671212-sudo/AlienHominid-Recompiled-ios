name: Build XenonRecomp Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-xenonrecomp:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          brew update
          brew install llvm
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Clone XenonRecomp
        run: |
          rm -rf xenonrecomp
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git xenonrecomp

      - name: Fix bundled fmt for modern Apple Clang headers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("xenonrecomp/thirdparty/fmt/include/fmt/format.h")
          s = p.read_text()

          # The bundled fmt allocator intentionally avoids the C++ runtime.
          # Apple Clang's modern libc headers do not expose malloc/free in the
          # global namespace in this compilation mode, so use Clang builtins.
          s = s.replace(
              "static_cast<T*>(malloc(n * sizeof(T)))",
              "static_cast<T*>(__builtin_malloc(n * sizeof(T)))"
          )
          s = s.replace(
              "void deallocate(T* p, size_t) { free(p); }",
              "void deallocate(T* p, size_t) { __builtin_free(p); }"
          )

          if "static_cast<T*>(__builtin_malloc(n * sizeof(T)))" not in s:
              raise SystemExit("fmt allocator patch did not match expected source")

          p.write_text(s)
          print("Patched fmt allocator to use Clang malloc/free builtins")
          PY

      - name: Configure XenonRecomp
        run: |
          cmake -S xenonrecomp -B xenonrecomp/build             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang"             -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++"

      - name: Build XenonRecomp
        run: |
          cmake --build xenonrecomp/build --config Release --parallel

      - name: Prepare iOS dependencies
        run: |
          rm -rf AlienHominid/vendored/SDL AlienHominid/vendored/simde
          git clone --depth 1 https://github.com/libsdl-org/SDL.git AlienHominid/vendored/SDL
          git clone --depth 1 https://github.com/simd-everywhere/simde.git AlienHominid/vendored/simde

      - name: Configure Alien Hominid iOS build
        run: |
          cmake -S AlienHominid -B AlienHominid/build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON

      - name: Build Alien Hominid iOS scaffold
        run: |
          cmake --build AlienHominid/build-ios --config Release --parallel

      - name: Show iOS build output
        run: |
          find AlienHominid/build-ios -maxdepth 6 -type d -name "*.app" -print
          find AlienHominid/build-ios -maxdepth 6 -type f -name "AlienHominid" -print

      - name: Show built tools
        run: |
          find xenonrecomp/build -type f -perm -111 -maxdepth 5 | sort

      - name: Upload XenonRecomp build
        uses: actions/upload-artifact@v4
        with:
          name: xenonrecomp-macos
          path: xenonrecomp/build/
          if-no-files-found: error


