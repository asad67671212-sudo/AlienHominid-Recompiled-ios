name: Build XenonRecomp Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-xenonrecomp:
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install LLVM/Clang
        run: |
          brew update
          brew install llvm
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Clone XenonRecomp
        run: |
          git clone --recursive https://github.com/hedge-dev/XenonRecomp.git xenonrecomp

      - name: Fix bundled fmt for modern Apple Clang headers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("xenonrecomp/thirdparty/fmt/include/fmt/format.h")
          s = p.read_text()

          # This bundled fmt release uses unqualified malloc/free in
          # templates. Modern Apple Clang requires the declarations to be
          # visible at template definition time. Use the C++ namespace
          # explicitly so lookup is unambiguous.
          if "#include <cstdlib>" not in s:
              marker = "#include <"
              i = s.find(marker)
              if i == -1:
                  raise SystemExit("Could not find fmt include section")
              s = s[:i] + "#include <cstdlib> // malloc/free declarations\n" + s[i:]

          s = s.replace("static_cast<T*>(malloc(n * sizeof(T)))",
                        "static_cast<T*>(std::malloc(n * sizeof(T)))")
          s = s.replace("void deallocate(T* p, size_t) { free(p); }",
                        "void deallocate(T* p, size_t) { std::free(p); }")

          p.write_text(s)
          print("Patched fmt allocator to use std::malloc/std::free")
          PY

      - name: Configure XenonRecomp
        run: |
          cmake -S xenonrecomp -B xenonrecomp/build             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang"             -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++"

      - name: Build XenonRecomp
        run: |
          cmake --build xenonrecomp/build --config Release --parallel

      - name: Show built tools
        run: |
          find xenonrecomp/build -type f -perm -111 -maxdepth 5 | sort

      - name: Upload XenonRecomp build
        uses: actions/upload-artifact@v4
        with:
          name: xenonrecomp-macos
          path: xenonrecomp/build/
          if-no-files-found: error
